services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dataly
      POSTGRES_PASSWORD: dataly
      POSTGRES_DB: dataly
    ports:
      - "5432:5432"
    volumes:
      - dataly_postgres_data:/var/lib/postgresql/data

volumes:
  dataly_postgres_data:
